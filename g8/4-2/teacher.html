:root{
  --paper:#F6F7F9; --card:#FFFFFF; --ink:#141B26; --muted:#5A6676; --rule:#D3D9E1;
  --beam:#C0761A; --beam-soft:#FBEBD3; --water:#1F5D8C; --water-soft:#DCEAF5;
  --done:#9AA5B3; --alarm:#B3261E;
  --t-self:#1F5D8C; --t-co:#2F7A4A; --t-peer:#7A4FA0; --t-guide:#C0761A; --t-ai:#141B26;
  --display:"Noto Serif TC","Songti TC",serif;
  --body:"Noto Sans TC","PingFang TC","Microsoft JhengHei",sans-serif;
  --num:"IBM Plex Mono",ui-monospace,Menlo,monospace;
  color-scheme:light;
}
*{box-sizing:border-box}
html,body{height:100%}
body{margin:0;background:var(--paper);color:var(--ink);font-family:var(--body);font-size:clamp(14px,1.25vw,22px);line-height:1.5}
.app{height:100%;display:grid;grid-template-rows:auto minmax(0,1fr) auto;padding-block:clamp(10px,1.4vw,22px);padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));gap:clamp(10px,1.2vw,20px)}

/* ── 流程帶 ── */
.flow{display:grid;gap:6px}
.phases{display:grid;grid-template-columns:5fr 25fr 10fr;gap:10px;font-size:.8em;font-weight:700;color:var(--muted)}
.phase{display:flex;align-items:center;gap:8px;white-space:nowrap}
.phase::after{content:"";flex:1;height:2px;background:var(--rule)}
.phase.now{color:var(--ink)}
.phase.now::after{background:var(--ink)}
.track{display:grid;grid-template-columns:var(--cols);gap:6px}
.node{all:unset;cursor:pointer;position:relative;min-width:0;border:2px solid var(--rule);background:var(--card);border-radius:10px;padding:6px 8px 8px;display:grid;gap:2px;align-content:start}
.node .nm{font-weight:900;font-size:.82em;line-height:1.3;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.node .mn{font-family:var(--num);font-size:.7em;color:var(--muted)}
.node .bar{position:absolute;left:0;bottom:0;height:4px;border-radius:0 0 8px 8px;background:var(--beam);width:0}
.node.done{border-color:transparent;background:transparent;color:var(--done)}
.node.done .nm::before{content:"✓ "}
.node.now{border-color:var(--ink);background:var(--ink);color:#fff;box-shadow:0 6px 18px rgba(20,27,38,.22)}
.node.now .mn{color:#C9D3DF}
.node:focus-visible{outline:3px solid var(--beam);outline-offset:2px}

/* ── 主畫面 ── */
.main{min-height:0;display:grid;grid-template-columns:minmax(0,1fr) clamp(260px,27vw,440px);gap:clamp(12px,1.6vw,28px)}
.stage{min-width:0;min-height:0;overflow:auto;background:var(--card);border-radius:18px;padding:clamp(16px,2.2vw,40px);display:grid;align-content:start;gap:clamp(10px,1.2vw,20px);border:1px solid var(--rule)}
.eyebrow{display:flex;flex-wrap:wrap;gap:8px;align-items:center;font-weight:700;font-size:.9em;color:var(--muted)}
.chip{color:#fff;border-radius:999px;padding:2px 12px;font-size:.9em;letter-spacing:.06em}
.stage h1{font-family:var(--display);font-weight:900;font-size:clamp(26px,3vw,56px);line-height:1.2;margin:0;text-wrap:balance}
.todo{list-style:none;margin:0;padding:0;display:grid;gap:clamp(8px,1vw,16px);counter-reset:s}
.todo li{counter-increment:s;display:grid;grid-template-columns:auto 1fr;gap:14px;align-items:baseline;font-size:clamp(17px,1.75vw,32px);font-weight:500;line-height:1.4}
.todo li::before{content:counter(s);font-family:var(--num);font-weight:600;font-size:.8em;color:var(--card);background:var(--water);border-radius:8px;min-width:1.6em;text-align:center;padding:0 .2em}
.todo b{color:var(--water)}
.extra{display:grid;gap:10px}
.box{border-radius:14px;padding:clamp(10px,1.2vw,20px);background:var(--beam-soft);font-size:clamp(16px,1.6vw,28px);line-height:1.5}
.box.water{background:var(--water-soft)}
.box .k{display:block;font-size:.62em;font-weight:900;letter-spacing:.12em;color:var(--beam)}
.box.water .k{color:var(--water)}
.stmt{display:grid;grid-template-columns:auto 1fr;gap:10px}
.stmt span:first-child{font-family:var(--num);font-weight:600}
.code{font-family:var(--num);font-weight:600;font-size:clamp(48px,6vw,120px);line-height:1;color:var(--beam);letter-spacing:.06em}
.reveal{all:unset;cursor:pointer;border:2px dashed var(--beam);border-radius:12px;padding:8px 18px;font-weight:700;color:var(--beam);justify-self:start}
.reveal:focus-visible{outline:3px solid var(--water);outline-offset:2px}
.frame{font-size:clamp(16px,1.6vw,30px);font-weight:700;line-height:1.7}
.frame u{text-decoration:none;border-bottom:3px solid var(--beam);padding:0 .6em}
.qr{display:flex;gap:20px;align-items:center;flex-wrap:wrap}
.qr .q{background:#fff;padding:10px;border-radius:12px;border:1px solid var(--rule);line-height:0}
.qr .u{font-family:var(--num);font-size:clamp(14px,1.5vw,26px);word-break:break-all;min-width:0}
video{width:100%;max-height:46vh;border-radius:12px;background:#000}
.adv{border:3px solid var(--t-peer);border-radius:14px;padding:clamp(10px,1.1vw,18px) clamp(12px,1.3vw,22px);background:#F1EAF8;display:grid;gap:4px}
.adv[hidden]{display:none}
.adv .k{font-size:clamp(13px,1vw,18px);font-weight:900;letter-spacing:.12em;color:var(--t-peer)}
.adv ul{margin:0;padding-left:1.2em;display:grid;gap:4px;font-size:clamp(14px,1.15vw,22px);font-weight:500;line-height:1.45}
.adv b{color:var(--t-peer)}
.watch{font-size:.85em;color:var(--muted);border-top:1px solid var(--rule);padding-top:10px}
.watch b{color:var(--ink)}

/* ── 計時器 ── */
.rcol{min-height:0;display:grid;grid-template-rows:minmax(0,1fr) auto;gap:clamp(10px,1.2vw,18px)}
.timer{background:var(--ink);color:#fff;border-radius:18px;padding:clamp(14px,1.8vw,30px);display:grid;align-content:space-between;gap:14px;min-height:0}
.timer .lab{font-size:.85em;color:#B9C4D2;font-weight:700;letter-spacing:.1em}
.clock{font-family:var(--num);font-weight:600;font-size:clamp(56px,7vw,140px);line-height:1;font-variant-numeric:tabular-nums;letter-spacing:-.02em}
.ring{height:12px;background:#2C3646;border-radius:99px;overflow:hidden}
.ring i{display:block;height:100%;width:100%;background:var(--beam);transform-origin:left}
.timer.warn .clock{color:#F6C15A}
.timer.over{background:var(--alarm)}
.timer.over .ring i{background:#fff}
.ctrls{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:8px}
.ctrls button{all:unset;cursor:pointer;text-align:center;border-radius:10px;padding:10px 4px;font-weight:700;background:#2C3646;color:#fff;font-size:.9em}
.ctrls button.go{background:var(--beam);color:var(--ink);grid-column:span 3;font-size:1.1em;padding:14px 4px}
.ctrls button:focus-visible{outline:3px solid #F6C15A;outline-offset:2px}
.total{font-size:.8em;color:#B9C4D2;font-family:var(--num)}

/* ── 底列 ── */
.foot{display:flex;flex-wrap:wrap;gap:8px 16px;align-items:center;justify-content:space-between;font-size:.78em;color:var(--muted)}
.foot .nav{display:flex;gap:8px}
.foot button{all:unset;cursor:pointer;border:1px solid var(--rule);background:var(--card);border-radius:8px;padding:6px 14px;font-weight:700;color:var(--ink)}
.foot button.on{background:var(--ink);color:#fff;border-color:var(--ink)}
.foot button:focus-visible{outline:3px solid var(--beam);outline-offset:2px}
kbd{font-family:var(--num);border:1px solid var(--rule);border-radius:4px;padding:0 5px;background:var(--card)}

@media (max-width:900px){
  .main{grid-template-columns:1fr}
  .track{grid-template-columns:repeat(5,minmax(0,1fr))}
  .phases{display:none}
  .stage{overflow:visible}
  html,body{height:auto}.app{height:auto}
}
@media (prefers-reduced-motion:reduce){*{transition:none!important;animation:none!important}}
.flash{animation:fl 1s steps(2) 3}
@keyframes fl{50%{background:#fff;color:var(--alarm)}}
</style>

const $=id=>document.getElementById(id);
let revealed=false,P=0,S,PH,cur=0,left=0,running=false,last=0,elapsed=0,beeped=false;
try{const v=JSON.parse(localStorage.getItem("ctrl42")||"null");if(v){P=v.P||0;cur=v.cur||0;elapsed=v.elapsed||0;}}catch(e){}
const save=()=>{try{localStorage.setItem("ctrl42",JSON.stringify({P,cur,elapsed}));}catch(e){}};
const mmss=s=>{const neg=s<0;s=Math.abs(Math.round(s));return (neg?"−":"")+Math.floor(s/60)+":"+String(s%60).padStart(2,"0");};
function setPeriod(k,keep){P=k;S=PERIODS[P].S;PH=PERIODS[P].PH.map((p,i)=>({nm:p.nm,min:S.filter(s=>s.ph===i).reduce((a,s)=>a+s.min,0)}));
  if(!keep){cur=0;elapsed=0;}cur=Math.min(cur,S.length-1);left=S[cur].min*60;running=false;
  $("pname").textContent=PERIODS[P].name;$("p1").classList.toggle("on",P===0);$("p2").classList.toggle("on",P===1);
  buildFlow();setGo();save();render();}
function buildFlow(){
  $("phases").innerHTML=PH.map((p,i)=>`<div class="phase" data-ph="${i}">${p.nm} ${p.min} 分</div>`).join("");
  const w=s=>Math.max(s.min,3.8);
  $("phases").style.gridTemplateColumns=PH.map((p,i)=>`${S.filter(s=>s.ph===i).reduce((a,s)=>a+w(s),0)}fr`).join(" ");
  $("track").style.setProperty("--cols",S.map(s=>`${w(s)}fr`).join(" "));
  $("track").innerHTML=S.map((s,i)=>`<button type="button" class="node" data-i="${i}" aria-label="${s.nm}，${s.min} 分鐘"><span class="nm">${s.nm}</span><span class="mn">${s.min} 分</span><span class="bar"></span></button>`).join("");
  $("track").querySelectorAll(".node").forEach(b=>b.addEventListener("click",()=>goTo(+b.dataset.i)));
}
function extra(x){
  if(!x)return "";
  if(x.qr)return `<div class="qr"><div class="q" id="qr"></div><div class="u">${/^https?:/.test(x.qr)?x.qr:BASE+x.qr}</div></div>`;
  if(x.box)return `<div class="box water">${x.box}</div>`;
  if(x.stmts)return `<div class="box water">${x.stmts.map((t,i)=>`<div class="stmt"><span>${i+1}.</span><span>${t}</span></div>`).join("")}</div>`;
  if(x.code)return `<div class="extra"><button type="button" class="reveal" id="rv">${revealed?"通關數字":"示範完，按這裡公布通關數字"}</button>${revealed?`<div class="code">${x.code}</div>`:""}</div>`;
  return "";
}
function render(){
  const s=S[cur];
  $("track").querySelectorAll(".node").forEach((b,i)=>{b.classList.toggle("done",i<cur);b.classList.toggle("now",i===cur);b.setAttribute("aria-current",i===cur?"step":"false");});
  $("phases").querySelectorAll(".phase").forEach((p,i)=>p.classList.toggle("now",i===s.ph));
  $("stage").innerHTML=`<div class="eyebrow">${PERIODS[P].name.split("：")[0]}・${PH[s.ph].nm}・${s.nm}${s.tags.map(t=>`<span class="chip" style="background:var(${TAG[t]})">${t}</span>`).join("")}</div>
    <h1>${s.h}</h1>
    <ol class="todo">${s.todo.map(t=>`<li><span>${t}</span></li>`).join("")}</ol>
    ${extra(s.extra)}
    ${s.watch?`<div class="watch"><b>老師提醒：</b>${s.watch}</div>`:""}`;
  if(s.extra&&s.extra.qr&&window.QRCode){const z=Math.min(220,Math.round(innerWidth*.12));new QRCode($("qr"),{text:/^https?:/.test(s.extra.qr)?s.extra.qr:BASE+s.extra.qr,width:z,height:z,correctLevel:QRCode.CorrectLevel.M});}
  if($("rv"))$("rv").addEventListener("click",()=>{revealed=true;render();});
  $("tLab").textContent=`${s.nm}・${s.min} 分鐘`;
  $("adv").hidden=!s.adv;$("adv").innerHTML=s.adv?`<span class="k">先完成的同學</span><ul>${s.adv.map(t=>`<li>${t}</li>`).join("")}</ul>`:"";
  tick(0);
}
function goTo(i){cur=Math.max(0,Math.min(S.length-1,i));left=S[cur].min*60;running=false;beeped=false;$("timer").classList.remove("over","warn");setGo();save();render();}
function setGo(){$("go").textContent=running?"暫停":(left<S[cur].min*60?"繼續":"開始倒數");}
function beep(){try{const a=new (window.AudioContext||window.webkitAudioContext)(),o=a.createOscillator(),g=a.createGain();o.frequency.value=880;o.connect(g);g.connect(a.destination);g.gain.setValueAtTime(.2,a.currentTime);g.gain.exponentialRampToValueAtTime(.001,a.currentTime+1.2);o.start();o.stop(a.currentTime+1.2);}catch(e){}}
function tick(dt){
  if(running){left-=dt;elapsed+=dt;}
  const full=S[cur].min*60;
  $("clock").textContent=mmss(left);
  $("ring").style.transform=`scaleX(${Math.max(0,left/full)})`;
  const node=$("track").querySelectorAll(".node")[cur];if(node)node.querySelector(".bar").style.width=`${Math.min(100,100*(1-left/full))}%`;
  $("timer").classList.toggle("warn",left<=60&&left>0);
  if(left<=0){$("timer").classList.add("over");if(!beeped&&running){beeped=true;beep();$("timer").classList.add("flash");setTimeout(()=>$("timer").classList.remove("flash"),3200);}}
  $("total").textContent=`本節已進行 ${mmss(elapsed)}／45:00`;
}
function loop(t){const dt=last?(t-last)/1000:0;last=t;if(running)tick(dt);if(running&&Math.floor(elapsed)%5===0)save();requestAnimationFrame(loop);}
$("go").addEventListener("click",()=>{running=!running;setGo();});
$("plus").addEventListener("click",()=>{left+=30;if(left>0)$("timer").classList.remove("over");tick(0);});
$("minus").addEventListener("click",()=>{left-=30;tick(0);});
$("reset").addEventListener("click",()=>goTo(cur));
$("prev").addEventListener("click",()=>goTo(cur-1));
$("next").addEventListener("click",()=>goTo(cur+1));
$("p1").addEventListener("click",()=>setPeriod(0));
$("p2").addEventListener("click",()=>setPeriod(1));
function fs(){const d=document.documentElement;try{document.fullscreenElement?document.exitFullscreen():d.requestFullscreen().catch(()=>{});}catch(e){}}
$("fs").addEventListener("click",fs);
addEventListener("keydown",e=>{
  if(e.key==="ArrowRight"||e.key==="PageDown"){goTo(cur+1);e.preventDefault();}
  else if(e.key==="ArrowLeft"||e.key==="PageUp"){goTo(cur-1);e.preventDefault();}
  else if(e.key===" "){running=!running;setGo();e.preventDefault();}
  else if(e.key==="f"||e.key==="F")fs();
  else if(e.key==="1")setPeriod(0);else if(e.key==="2")setPeriod(1);
  else if(e.key==="r"||e.key==="R")goTo(cur);});
try{navigator.wakeLock&&navigator.wakeLock.request("screen").catch(()=>{});}catch(e){}
setPeriod(P,true);requestAnimationFrame(loop);
</script>

<!doctype html>
<html lang="zh-Hant"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>聲音迷思提示</title>
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Noto+Sans+TC:wght@400;500;700&family=Noto+Serif+TC:wght@700;900&display=swap">
<style>:root{
  --bg:#EFF2F5; --panel:#FFFFFF; --ink:#1B2430; --muted:#566273; --line:#CBD3DD;
  --wave:#2C5D8A; --wave-soft:#DCE7F2; --rope:#8A4B22; --rope-soft:#F4E6DA;
  --ok:#2F6B3A; --ok-soft:#E1EFE3;
  --display:"Noto Serif TC","Songti TC",serif;
  --body:"Noto Sans TC","PingFang TC","Microsoft JhengHei",sans-serif;
  color-scheme:light;
}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font-family:var(--body);font-size:17px;line-height:1.7}
.wrap{max-width:720px;margin:0 auto;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));padding-block:18px 48px;display:grid;gap:16px}
header{display:grid;gap:4px}
.eyebrow{font-size:12px;letter-spacing:.12em;color:var(--wave);font-weight:700}
h1{font-family:var(--display);font-size:clamp(22px,5vw,30px);margin:0;line-height:1.3}
.sub{color:var(--muted);margin:0;font-size:15px}
section{background:var(--panel);border:1px solid var(--line);border-radius:14px;padding:16px;display:grid;gap:12px;min-width:0}
h2{font-size:19px;margin:0}
p{margin:0}
.btn{all:unset;box-sizing:border-box;cursor:pointer;display:inline-flex;align-items:center;justify-content:center;min-height:46px;padding:0 18px;border-radius:10px;font-weight:700;font-size:16px;border:2px solid var(--wave);color:var(--wave);background:transparent;text-align:center}
.btn.primary{background:var(--wave);color:var(--panel)}
.btn.rope{border-color:var(--rope);color:var(--rope)}
.btn.rope.primary{background:var(--rope);color:var(--panel)}
.btn:focus-visible{outline:3px solid var(--rope);outline-offset:2px}
.btn[disabled]{opacity:.4;cursor:default}
.note{font-size:14px;color:var(--muted)}
.row{display:flex;flex-wrap:wrap;gap:10px;align-items:center}
ol.ans{margin:0;padding-left:1.4em;display:grid;gap:8px}
b.a{color:var(--ok);background:var(--ok-soft);border-radius:4px;padding:0 4px}
table{border-collapse:collapse;width:100%;font-size:15px}
th,td{border:1px solid var(--line);padding:6px 8px;text-align:center}
th{background:var(--bg);font-weight:700}
.tbl{overflow-x:auto}
@media (prefers-reduced-motion:reduce){*{transition:none!important}}
[hidden]{display:none!important}

.opts{display:grid;gap:6px;margin:0;padding:0;list-style:none}
.opts li{padding:8px 10px;border:1px solid var(--line);border-radius:10px;background:var(--bg)}
.opts li.right{border-color:var(--ok);background:var(--ok-soft);font-weight:700}
.step{border-left:5px solid var(--rope);background:var(--rope-soft);border-radius:10px;padding:12px 14px;display:grid;gap:4px}
.step.exp{border-color:var(--ok);background:var(--ok-soft)}
.step .k{font-size:13px;font-weight:700;letter-spacing:.06em;color:var(--rope)}
.step.exp .k{color:var(--ok)}
.nav{display:flex;justify-content:space-between;gap:10px}
.qno{font-family:ui-monospace,Menlo,monospace;font-weight:700;color:var(--wave)}
</style></head><body><div class="wrap">
<header><div class="eyebrow">八年級自然・3-2～3-4 複習單・第 5 關</div><h1 id="title">破解迷思：提示</h1>
<p class="sub">先看提示一，自己再想一次；還不會再看提示二；最後才看解析。</p></header>
<section>
<p><span class="qno" id="no"></span> <span class="note" id="sec"></span></p>
<p id="stem" style="font-weight:700"></p>
<ul class="opts" id="opts"></ul>
</section>
<section>
<div class="row"><button class="btn rope primary" id="b1" type="button">看提示一</button></div>
<div class="step" id="s1" hidden><span class="k">提示一</span><p id="h1"></p></div>
<div class="row" id="r2" hidden><button class="btn rope" id="b2" type="button">還是不會，看提示二</button></div>
<div class="step" id="s2" hidden><span class="k">提示二</span><p id="h2"></p></div>
<div class="row" id="r3" hidden><button class="btn" id="b3" type="button">看答案與解析</button></div>
<div class="step exp" id="s3" hidden><span class="k">答案與解析</span><p id="ans" style="font-weight:700"></p><p id="exp"></p></div>
</section>
<div class="nav"><button class="btn" id="prev" type="button">← 上一題</button><button class="btn" id="next" type="button">下一題 →</button></div>
</div>
<script>
const Q=[{"sec":"3-2","stem":"在空氣中傳播的聲波，屬於哪一種波？","opts":["橫波，因為示波器上看到高低起伏的波形","橫波，因為空氣分子上下振動","縱波，因為空氣振動方向與聲波前進方向平行","非力學波，因為不需要介質"],"ans":2,"h1":"回想 3-1：橫波和縱波怎麼分？看「介質振動方向」和「波前進方向」的關係。","h2":"音叉振動時，把空氣推擠得一疏一密。示波器只是把聲音「轉換成」上下起伏的圖，方便我們觀察。","exp":"音叉振動使空氣疏密相間向外傳播，空氣振動方向與傳播方向平行，是縱波。(A) 是最常見的迷思：示波器畫面是轉換後的圖示，不是聲波本身的樣子。"},{"sec":"3-2","stem":"小華說：「我聽得到喇叭的聲音，是因為空氣從喇叭一路流到我的耳朵。」這個說法：","opts":["正確，聲音就是流動的空氣","正確，所以逆風時完全聽不到聲音","錯誤，聲音是靠光帶過來的","錯誤，空氣只在原處來回振動，傳過來的是能量"],"ans":3,"h1":"連結 3-1：波傳過去時，介質會不會跟著往前跑？","h2":"繩波上的蝴蝶結 P 只在原處上下振動。空氣是聲波的介質，它的行為和蝴蝶結一樣嗎？","exp":"聲波和繩波一樣，介質（空氣）只在原處來回振動，傳遞的是能量。"},{"sec":"3-2","stem":"關於聲速，下列敘述何者正確？","opts":["聲音越大，聲速越快","音調越高，聲速越快","在同溫度的空氣中，各種聲音的聲速相同","聲音在水中比在空氣中慢"],"ans":2,"h1":"聲速由「聲源」決定，還是由「介質」決定？","h2":"(A)(B) 改變的是聲音本身（聲源）；(C) 說的是同一種介質；(D) 想想液體和氣體誰傳得快。","exp":"聲速只與介質有關，與聲音大小、音調無關；水中聲速比空氣中快。"},{"sec":"3-2","stem":"下列哪一種做法，會使聲音在空氣中傳播得更快？","opts":["把喇叭音量調大","把音調調高","讓發聲體振動得更快","讓氣溫升高"],"ans":3,"h1":"和上一題一樣：哪一個選項改變的是「介質」？","h2":"(A)(B)(C) 都在改變聲源；只有一個選項改變了空氣本身的狀態。","exp":"聲速與發聲體的振動快慢無關，而與介質有關；空氣中溫度愈高，聲速愈快。"},{"sec":"3-3","stem":"小明說：「示波器上的波越高，代表聲音的音調越高。」這個說法：","opts":["正確，波越高，頻率也越大","錯誤，波越高代表響度越大；音調要看頻率","錯誤，波越高代表音色越好聽","正確，因為音調就是聲音大小"],"ans":1,"h1":"日常說的「聲音很高」可能指「大聲」，也可能指「尖細」。科學上要分清楚。","h2":"示波器上「波的高度」是振幅，振幅決定三要素中的哪一個？音調看的是同一段時間內波的個數。","exp":"波的高度是振幅，決定響度；音調由頻率決定。迷思：把「大聲」和「高音」混為一談。"},{"sec":"3-3","stem":"吉他手把弦「調緊」，並且「撥得更用力」。和原本相比，下列何者正確？","opts":["音調變高、響度變大、聲速變快","音調不變、響度變大、聲速不變","音調變低、響度不變、聲速變快","音調變高、響度變大、聲速不變"],"ans":3,"h1":"一個動作對應一個要素：「調緊」改變什麼？「用力」改變什麼？","h2":"發音體愈緊，音調愈高；用力撥，振幅變大。最後別忘了：聲速由什麼決定？弦換了空氣嗎？","exp":"調緊使頻率變高（音調變高）；用力撥使振幅變大（響度變大）；聲速由空氣決定，不變。"},{"sec":"3-3","stem":"一般女生說話的音調比男生高，主要是因為：","opts":["女生說話比較大聲","女生聲帶振動的頻率較高","女生的聲音在空氣中傳得比較快","女生聲音的振幅較大"],"ans":1,"h1":"音調由三要素的哪個特徵決定？","h2":"「大聲」和「振幅」說的是響度；「傳得快」說的是聲速。剩下哪一個跟音調有關？","exp":"音調由頻率決定。響度（大聲）與振幅有關，與音調無關；聲速由介質決定。"},{"sec":"3-3","stem":"在同一間教室的空氣中，有 440 Hz 和 220 Hz 兩個聲音。下列何者正確？","opts":["440 Hz 的聲速是 220 Hz 的兩倍","440 Hz 的波長是 220 Hz 的兩倍","兩者的波長相同","440 Hz 的波長是 220 Hz 的一半"],"ans":3,"h1":"先確定什麼「一樣」：兩個聲音在同一種介質中，聲速相同嗎？","h2":"用 λ＝v÷f：v 一樣，f 變成 2 倍，λ 會變幾倍？","exp":"同介質聲速相同；頻率是 2 倍，波長就是一半。迷思：(A) 以為音調高的聲音傳得快。"},{"sec":"3-4","stem":"在教室裡說話，通常感覺不到回聲，主要原因是：","opts":["教室牆壁不會反射聲音","聲音在室內無法傳播","牆壁太近，原聲與回聲相隔時間太短，耳朵分辨不出來","回聲只會在山谷中發生"],"ans":2,"h1":"聲音碰到教室牆壁，會不會反射？","h2":"牆壁很近時，回聲幾乎和原聲同時到達耳朵。耳朵能分開聽見兩次嗎？","exp":"聲音其實有反射，但障礙物太近，原聲與回聲相隔時間太短，人耳無法分辨；周遭物體也會吸收聲音。迷思：以為「聽不到回聲＝沒有反射」。"},{"sec":"3-4","stem":"關於超聲波，下列敘述何者正確？","opts":["超聲波就是音量很大的聲音","在同一介質中，超聲波傳得比一般聲波快","超聲波不需要介質也能傳播","頻率超過 20000 Hz，人耳聽不到"],"ans":3,"h1":"「超」聲波是什麼超過了？頻率？還是響度？","h2":"超聲波也是聲波：需不需要介質？在同一種介質中，聲速由什麼決定？","exp":"超聲波是頻率超過 20000 Hz 的聲波，人耳聽不到；它也需要介質，在相同介質中速率與一般聲波相同。"},{"sec":"3-4","stem":"船上的聲納向海底發出超聲波，2 秒後收到回聲。若海水中聲速為 1500 m/s，此處海深約多少？","opts":["750 m","1500 m","3000 m","6000 m"],"ans":1,"h1":"聲波在這 2 秒內，走了「一趟」還是「一去一回」？","h2":"先算總距離＝1500×2，這是「下去＋上來」的距離。海深是總距離的幾分之幾？","exp":"總距離＝1500×2＝3000 m（來回），海深＝3000÷2＝1500 m。(C) 忘了除以 2。"},{"sec":"3-4","stem":"下列敘述何者正確？","opts":["柔軟的表面比堅硬的表面更容易反射聲音","人耳聽不到超聲波，是因為它傳得太快","聲納是利用聲波的反射來測量距離","聽不到回聲，就表示聲音沒有發生反射"],"ans":2,"h1":"一個一個選項檢查，每個選項都藏著一個迷思。","h2":"(A) 吸音板是軟的還是硬的？(B) 超聲波「超」的是什麼？(D) 回想第 9 題教室的例子。","exp":"(A) 堅硬光滑的表面較易反射；(B) 聽不到是因為頻率太高；(D) 可能是相隔時間太短或聲音被吸收。"}];const L=['(A)','(B)','(C)','(D)'];const $=id=>document.getElementById(id);
let i=0;
function load(){const m=location.hash.match(/^#q(\d+)$/);i=m?Math.min(Q.length,Math.max(1,+m[1]))-1:0;render();}
function render(){const q=Q[i];
  $('no').textContent='第 '+(i+1)+' 題';$('sec').textContent='（'+q.sec+'）';$('stem').textContent=q.stem;
  $('opts').innerHTML='';q.opts.forEach((o,k)=>{const li=document.createElement('li');li.id='o'+k;li.textContent=L[k]+' '+o;$('opts').appendChild(li);});
  $('h1').textContent=q.h1;$('h2').textContent=q.h2;$('ans').textContent='答案：'+L[q.ans]+' '+q.opts[q.ans];$('exp').textContent=q.exp;
  ['s1','s2','s3','r2','r3'].forEach(id=>$(id).hidden=true);$('b1').parentElement.hidden=false;
  $('prev').disabled=i===0;$('next').disabled=i===Q.length-1;window.scrollTo(0,0);}
$('b1').onclick=()=>{$('s1').hidden=false;$('b1').parentElement.hidden=true;$('r2').hidden=false;};
$('b2').onclick=()=>{$('s2').hidden=false;$('r2').hidden=true;$('r3').hidden=false;};
$('b3').onclick=()=>{$('s3').hidden=false;$('r3').hidden=true;$('o'+Q[i].ans).classList.add('right');};
$('prev').onclick=()=>{location.hash='q'+i;};$('next').onclick=()=>{location.hash='q'+(i+2);};
window.addEventListener('hashchange',load);load();
</script></body></html>

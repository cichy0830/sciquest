<!doctype html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>折射偵探站</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Noto+Sans+TC:wght@400;500;700&family=Noto+Serif+TC:wght@700;900&display=swap">
<style>
/* 版面：左（直向時為上）依步驟切換「影片 → 模擬器 → 我的數據」；右（下）一次只顯示一個步驟 */
:root{
  --bg:#EFF2F5; --panel:#FFFFFF; --ink:#1B2430; --muted:#566273; --line:#CBD3DD;
  --wave:#2C5D8A; --wave-soft:#DCE7F2; --rope:#8A4B22; --rope-soft:#F4E6DA;
  --ok:#2F6B3A; --ok-soft:#E1EFE3;
  --display:"Noto Serif TC","Songti TC",serif;
  --body:"Noto Sans TC","PingFang TC","Microsoft JhengHei",sans-serif;
  --mono:ui-monospace,"SF Mono",Menlo,monospace;
  color-scheme:light;
}
*{box-sizing:border-box}
html,body{height:100%;margin:0}
body{background:var(--bg);color:var(--ink);font-family:var(--body);font-size:17px;line-height:1.6}
.app{height:100%;display:grid;grid-template-rows:auto minmax(0,1fr)}
.top{display:flex;flex-wrap:wrap;align-items:center;gap:4px 14px;padding:8px max(14px,env(safe-area-inset-right,0px)) 8px max(14px,env(safe-area-inset-left,0px));padding-top:max(8px,env(safe-area-inset-top,0px));background:var(--panel);border-bottom:1px solid var(--line)}
.top .eyebrow{font-size:12px;letter-spacing:.12em;color:var(--wave);font-weight:700}
.top h1{font-family:var(--display);font-size:clamp(19px,2.6vw,24px);margin:0;line-height:1.3}
.prog{margin-left:auto;display:flex;gap:6px;align-items:center;font-size:13px;color:var(--muted)}
.prog .bar{width:120px;height:8px;border-radius:99px;background:var(--line);overflow:hidden}
.prog .bar i{display:block;height:100%;background:var(--wave);width:0}
.split{display:grid;grid-template-columns:minmax(0,1.55fr) minmax(330px,1fr);min-height:0}
@media (max-width:900px), (orientation:portrait){.split{grid-template-columns:1fr;grid-template-rows:minmax(0,52fr) minmax(0,48fr)}}
.left{position:relative;min-height:0;background:var(--panel);border-right:1px solid var(--line);display:grid;grid-template-rows:minmax(0,1fr) auto}
@media (max-width:900px), (orientation:portrait){.left{border-right:0;border-bottom:3px solid var(--rope)}}
.pane{min-height:0;display:none}
.pane.on{display:block}
#paneVideo{background:#111;display:none;place-items:center}
#paneVideo.on{display:grid}
#paneVideo video{width:100%;height:100%;max-height:100%;object-fit:contain;background:#111}
#paneSim iframe{width:100%;height:100%;border:0;display:block;background:#fff}
#paneData{overflow-y:auto;-webkit-overflow-scrolling:touch;padding:16px;background:var(--bg)}
.simbar{display:flex;gap:8px 14px;flex-wrap:wrap;align-items:center;justify-content:space-between;font-size:13px;color:var(--muted);padding:5px 12px;background:var(--panel);border-top:1px solid var(--line)}
.simbar button,.simbar a{all:unset;cursor:pointer;color:var(--wave);font-weight:700}
.simbar button:focus-visible,.simbar a:focus-visible{outline:3px solid var(--rope);outline-offset:2px}
.side{overflow-y:auto;-webkit-overflow-scrolling:touch;min-height:0;padding:14px max(14px,env(safe-area-inset-right,0px)) 30px max(14px,env(safe-area-inset-left,0px))}
.step{background:var(--panel);border:1px solid var(--line);border-radius:16px;padding:18px;display:grid;gap:14px}
.kicker{font-size:13px;font-weight:700;letter-spacing:.08em;color:var(--rope)}
.step h2{margin:0;font-size:22px;line-height:1.45;text-wrap:balance}
.step p{margin:0}
.note{font-size:14px;color:var(--muted)}
.ui{font-weight:700;border:1px solid var(--line);background:var(--bg);border-radius:6px;padding:0 6px;white-space:nowrap}
.big{font-size:20px;line-height:1.6;padding:14px;border-radius:12px;background:var(--bg);border:2px solid var(--line)}
.opts{display:flex;flex-wrap:wrap;gap:8px}
.opt{all:unset;box-sizing:border-box;cursor:pointer;min-height:52px;min-width:88px;padding:8px 16px;border:2px solid var(--line);border-radius:12px;background:var(--bg);font-weight:700;font-size:18px;display:inline-flex;align-items:center;justify-content:center;text-align:center}
.opt[aria-pressed="true"]{border-color:var(--wave);background:var(--wave);color:var(--panel)}
.opt:focus-visible,.btn:focus-visible,input:focus-visible,textarea:focus-visible{outline:3px solid var(--rope);outline-offset:2px}
.lab{font-size:14px;color:var(--muted);font-weight:700}
.fields{display:grid;grid-template-columns:repeat(auto-fit,minmax(130px,1fr));gap:10px}
.field{display:grid;gap:4px}
.field input{font:inherit;font-size:24px;font-weight:700;width:100%;padding:8px 10px;border:2px solid var(--line);border-radius:10px;background:var(--bg);color:var(--ink);text-align:center;font-variant-numeric:tabular-nums}
.unit{font-size:14px;color:var(--muted)}
textarea{font:inherit;width:100%;min-height:96px;padding:10px;border:2px solid var(--line);border-radius:10px;background:var(--bg);color:var(--ink)}
.row{display:flex;flex-wrap:wrap;gap:10px;align-items:center}
.btn{display:inline-flex;align-items:center;justify-content:center;min-height:50px;padding:0 20px;border-radius:12px;font-weight:700;font-size:17px;text-decoration:none;cursor:pointer;border:2px solid var(--wave);font-family:var(--body);background:transparent;color:var(--wave)}
.btn.primary{background:var(--wave);color:var(--panel)}
.btn[disabled]{opacity:.35;cursor:not-allowed}
.nav{display:flex;justify-content:space-between;gap:10px;margin-top:4px}
.fb{min-height:1.5em;font-weight:700;border-radius:10px}
.fb.good{color:var(--ok);background:var(--ok-soft);padding:8px 12px}
.fb.bad{color:var(--rope);background:var(--rope-soft);padding:8px 12px}
.gate{border:2px dashed var(--rope);border-radius:12px;padding:14px;display:grid;gap:8px;background:var(--rope-soft)}
.tip{border-left:5px solid var(--rope);background:var(--rope-soft);border-radius:10px;padding:10px 12px;display:grid;gap:4px}
.tip b{color:var(--rope)}
table{border-collapse:collapse;width:100%;font-size:16px;font-variant-numeric:tabular-nums}
th,td{border-bottom:1px solid var(--line);padding:7px 4px;text-align:center}
th{color:var(--muted);font-weight:500;font-size:13px}
pre{margin:0;white-space:pre-wrap;word-break:break-word;font-family:var(--body);font-size:14px;line-height:1.6;background:var(--bg);border:1px solid var(--line);border-radius:10px;padding:12px;max-height:220px;overflow:auto}
details summary{cursor:pointer;color:var(--muted);font-size:14px}
.stmt{display:grid;gap:6px;padding:10px 12px;border:2px solid var(--line);border-radius:12px;background:var(--bg)}
.was{font-size:13px;color:var(--muted)}
.card{border-left:5px solid var(--wave);background:var(--wave-soft);border-radius:10px;padding:12px 14px;display:grid;gap:6px}
.chg{font-weight:700;color:var(--rope)}
.tiny{all:unset;cursor:pointer;font-size:13px;color:var(--muted);text-decoration:underline}
/* 我的數據面板 */
.dcard{background:var(--panel);border:2px solid var(--wave);border-radius:16px;padding:16px;display:grid;gap:12px;max-width:760px;margin:0 auto}
.dcard h2{margin:0;font-size:22px}
.grp{display:grid;grid-template-columns:auto 1fr;gap:4px 14px;align-items:center;padding:12px;border-radius:12px;background:var(--bg)}
.grp .tag{grid-row:span 2;font-weight:900;font-size:20px;color:var(--panel);background:var(--wave);border-radius:10px;padding:8px 12px;text-align:center;line-height:1.25}
.grp .tag small{display:block;font-size:12px;font-weight:700}
.grp .val{font-size:19px}
.grp .val b{font-size:24px;font-variant-numeric:tabular-nums}
.grp .obs{font-size:15px;color:var(--muted)}
.mine{display:grid;gap:4px;font-size:15px}
.lr::after{content:"左邊"}
@media (max-width:900px), (orientation:portrait){.lr::after{content:"上方"}}
.split.noleft{grid-template-columns:1fr!important;grid-template-rows:1fr!important}.split.noleft .left{display:none}
@media (prefers-reduced-motion:reduce){*{transition:none!important}}
</style>
</head>
<body>
<div class="app">
  <div class="top">
    <span class="eyebrow">八年級自然・4-3 光的折射</span>
    <h1>帶著數據問 e度：杯底硬幣現身的折射祕密</h1>
    <div class="prog" aria-label="進度"><span id="progTxt"></span><span class="bar"><i id="progBar"></i></span></div>
  </div>

  <div class="split">
    <div class="left">
      <div class="pane" id="paneVideo"><video id="vid" src="video.mp4" controls playsinline preload="metadata"></video></div>
      <div class="pane" id="paneSim"><iframe id="simFrame" title="光的折射模擬器" allow="fullscreen"></iframe></div>
      <div class="pane" id="paneData"></div>
      <div class="simbar" id="bar"></div>
    </div>
    <div class="side" id="side" aria-live="polite"></div>
  </div>
</div>

<script>
/* ===== 模擬器來源：主要用 PhET 官網；備用版是放在同資料夾的離線檔 ===== */
const SIM_MAIN="https://phet.colorado.edu/sims/html/bending-light/latest/bending-light_all.html?locale=zh_TW&screens=1";
const SIM_BACKUP="bending-light_all.html?locale=zh_TW&screens=1";
const GATE_CODE="43"; /* 老師示範完公布的通關數字 */
/* 三個檢查點：老師在全班面前問完問題，再公布數字放行 */
const GATES={A:"43",B:"27",C:"86"};
/* 三種角色：各用不同的 e度 精靈與提示詞 */
const ROLES={adv:{nm:"顧問",bot:"自然探究精靈"},lead:{nm:"組長",bot:"一般模式"},mem:{nm:"組員",bot:"樂學精靈"}};

/* ===== 4 句迷思是非題（正解只在教師資料，網頁不顯示） ===== */
const STMTS=[
  "光從空氣進入水中，因為光的直進性，不會發生偏折。",
  "光由水中斜射入空氣時，折射角比入射角小。",
  "光沿原來的折射線反方向射回去，會沿原來的入射線射出。",
  "加水後看得到硬幣，是因為眼睛發出的光被水面偏折。"
];
const N={空氣:1.00,水:1.33};
const deg=r=>r*180/Math.PI, rad=d=>d*Math.PI/180;
function snell(i,n1,n2){const s=n1*Math.sin(rad(i))/n2;return Math.abs(s)>1?null:deg(Math.asin(s));}
const TOL=4;

/* ===== 狀態（存在這台 iPad 的瀏覽器裡） ===== */
const KEY="refr43-v3";
let st={seat:"",role:"",gates:{},pconf:{},watched:false,pre:{},conf:{},d:{},obs:{},post:{},why:"",i:0,skip:{},tries:{},gate:false,sim:"main"};
try{const s=JSON.parse(localStorage.getItem(KEY)||"null");if(s)st=Object.assign(st,s);}catch(e){}
const save=()=>{try{localStorage.setItem(KEY,JSON.stringify(st));}catch(e){}};
const $=id=>document.getElementById(id);
const num=v=>{const x=parseFloat(String(v??"").replace(/[^\d.\-]/g,""));return isFinite(x)?x:null;};
const r1=x=>x==null?"—":(Math.round(x*10)/10).toString();
const esc=s=>String(s).replace(/[&<>"]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));
const mk=v=>v==="O"?"○":v==="X"?"✗":"—";

/* ===== 每個步驟只做一件事；left 指定左邊要顯示什麼 ===== */
const STEPS=[];
const add=o=>STEPS.push(o);

add({k:"開始",left:"none",render:()=>`
  <h2>先寫下你的座號</h2>
  <div class="field" style="max-width:200px"><span class="lab">座號</span><input id="seat" inputmode="numeric" value="${esc(st.seat)}" aria-label="座號"></div>`,
  bind:()=>$("seat").addEventListener("input",e=>{st.seat=e.target.value.trim();save();navState();}),
  ok:()=>!!st.seat});

add({k:"選角色",left:"none",render:()=>`
  <h2>你今天的角色是？</h2>
  <div class="opts" id="roles">${Object.entries(ROLES).map(([v,r])=>`<button type="button" class="opt" data-v="${v}" aria-pressed="${st.role===v}">${r.nm}</button>`).join("")}</div>
  <p class="note">選錯了可以按「上一步」回來改。等一下問 e度 時，不同角色會拿到不同的提示詞。</p>`,
  bind:()=>$("roles").addEventListener("click",e=>{const b=e.target.closest(".opt");if(!b)return;st.role=b.dataset.v;save();
    $("roles").querySelectorAll(".opt").forEach(x=>x.setAttribute("aria-pressed",String(x===b)));navState();}),
  ok:()=>!!st.role});

add({k:"看影片",left:"video",render:()=>`
  <h2>看<span class="lr"></span>的影片</h2>
  <p>按影片的<span class="ui">▶ 播放</span>，從頭看到最後。</p>
  <p class="note">看完才能按「下一步」。看不清楚可以再看一次。</p>
  <p class="fb${st.watched?" good":""}" id="fb" role="status">${st.watched?"看完了！按下一步。":""}</p>`,
  ok:()=>st.watched});

STMTS.forEach((t,ix)=>{const n=ix+1;add({k:`你覺得呢？ ${n}／${STMTS.length}`,left:"video",render:()=>`
  <h2>這句話對嗎？</h2>
  <div class="big"><b>${n}.</b> ${t}</div>
  <div class="lab">憑直覺選</div>
  <div class="opts" data-grp="pre">${["○ 對","✗ 錯"].map((l,j)=>`<button type="button" class="opt" data-v="${j?"X":"O"}" aria-pressed="${st.pre[n]===(j?"X":"O")}">${l}</button>`).join("")}</div>
  <div class="lab">把握程度</div>
  <div class="opts" data-grp="conf">${[["sure","有把握"],["guess","用猜的"]].map(([v,l])=>`<button type="button" class="opt" data-v="${v}" aria-pressed="${st.conf[n]===v}">${l}</button>`).join("")}</div>
  <p class="note">不用寫理由，等一下用模擬器找證據。</p>`,
  bind:()=>document.querySelectorAll(".opts").forEach(g=>g.addEventListener("click",e=>{const b=e.target.closest(".opt");if(!b)return;
    st[g.dataset.grp][n]=b.dataset.v;save();g.querySelectorAll(".opt").forEach(x=>x.setAttribute("aria-pressed",String(x===b)));navState();
    if(st.pre[n]&&st.conf[n])setTimeout(()=>go(1),350);})),
  ok:()=>!!(st.pre[n]&&st.conf[n])});});

add({k:"等一下",left:"sim",render:()=>isAdv()?`<h2>顧問先走：開始量數據</h2>${ADV_PASS}`:`
  <h2>看老師示範，等老師公布通關數字</h2>
  <div class="gate"><span>老師會在大螢幕示範怎麼用模擬器。示範完會說出一個數字，填進來就能開始。</span>
  <div class="field" style="max-width:180px"><span class="lab">通關數字</span><input id="code" inputmode="numeric" aria-label="通關數字" value="${st.gate?GATE_CODE:""}"></div></div>
  <p class="fb" id="fb" role="status"></p>`,
  bind:()=>!isAdv()&&$("code").addEventListener("input",e=>{st.gate=e.target.value.trim()===GATE_CODE;save();navState();
    const f=$("fb");f.className="fb"+(st.gate?" good":"");f.textContent=st.gate?"可以開始了！":"";}),
  ok:()=>st.gate||isAdv()});

const isAdv=()=>st.role==="adv";
const ADV_PASS=`<div class="tip"><b>你是顧問：不用等通關數字</b><span>直接按「下一步」繼續往前做，先完成自己的探究歷程卡。</span></div>`;
function gateStep(key,k,title,body){add({k,left:"data",render:()=>isAdv()?`<h2>顧問先走：繼續往下做</h2>${ADV_PASS}`:`
  <h2>${title}</h2>
  <div class="gate"><span>${body}</span>
  <div class="field" style="max-width:180px"><span class="lab">通關數字</span><input id="code" inputmode="numeric" aria-label="通關數字" value="${st.gates[key]?GATES[key]:""}"></div></div>
  <p class="fb${st.gates[key]?" good":""}" id="fb" role="status">${st.gates[key]?"可以繼續了！":""}</p>`,
  bind:()=>!isAdv()&&$("code").addEventListener("input",e=>{st.gates[key]=e.target.value.trim()===GATES[key];save();navState();
    const f=$("fb");f.className="fb"+(st.gates[key]?" good":"");f.textContent=st.gates[key]?"可以繼續了！":"";}),
  ok:()=>isAdv()||!!st.gates[key]});}

/* --- 空氣 → 水：第 1 組（垂直）、第 2 組（斜射） --- */
add({k:"空氣→水",left:"sim",render:()=>`
  <h2>確認模擬器：上方是 <span class="ui">空氣</span>，下方是 <span class="ui">水</span></h2>
  <p>模擬器的上、下兩個方框各有一個選單，確認上面選<span class="ui">空氣</span>、下面選<span class="ui">水</span>。</p>`,check:"設定好了"});
add({k:"空氣→水",left:"sim",render:()=>`
  <h2>打開雷射筆</h2>
  <p>按雷射筆上的<span class="ui">紅色按鈕</span>，光線射向水面。</p>
  <p class="note">中間那條虛線就是<b>法線</b>：通過入射點、垂直界面的直線。</p>`,check:"看到光線了"});
add({k:"空氣→水",left:"sim",render:()=>`
  <h2>移動光源，看光有沒有轉彎</h2>
  <p>拖動雷射筆，從<b>正上方</b>慢慢往旁邊移，再移回來。看進到水裡的光線：</p>
  ${choice("o0",[["only","只有從正上方射下時不轉彎"],["never","不管怎麼射都不轉彎"],["always","不管怎麼射都會轉彎"]])}
  <p class="fb" id="fb" role="status"></p>`,
  bind:()=>bindChoice("o0","only","對！只有垂直射入時不偏折，斜斜射入都會偏折。","再移動一次雷射筆，特別看看正上方和斜射時有什麼不同。"),ok:()=>st.obs.o0==="only"});
add({k:"空氣→水",left:"sim",render:()=>`
  <h2>放好量角器</h2>
  <p>從模擬器的工具箱把<span class="ui">量角器</span>拖出來，<b>中心</b>對準光打到水面的那一點。</p>
  <div class="tip"><span><b>0°</b> 要對準<b>法線</b>（虛線）</span><span><b>90°</b> 要對齊<b>交界面</b>（水面）</span></div>
  <p class="note">角度一律從法線量起，不是從水面量。</p>`,check:"0° 對法線、90° 對水面了"});
add({k:"第 1 組・垂直射入",left:"sim",render:()=>angleStep("v",`把雷射筆拖到<b>正上方</b>，讓光<b>垂直</b>射入水面（入射角 0°），讀出折射角。`,"空氣","水",false,0),
  bind:()=>bindAngles("v","空氣","水",false,0),ok:()=>passed("v")});
add({k:"第 2 組・斜射入水",left:"sim",render:()=>angleStep("w",`拖動雷射筆，讓<b>入射角</b>大約 <b>45°</b>，再讀出水中的<b>折射角</b>。`,"空氣","水",true),
  bind:()=>bindAngles("w","空氣","水",true),ok:()=>passed("w")});
add({k:"第 2 組・斜射入水",left:"sim",render:()=>`
  <h2>看一看：斜射進水裡的光線</h2>
  <p>入射角 <b>${r1(num(st.d.w_i))}°</b>、折射角 <b>${r1(num(st.d.w_r))}°</b>。折射線跟入射線比起來：</p>
  ${choice("o1",[["toward","偏向法線（更靠近虛線）"],["away","偏離法線（離虛線更遠）"],["none","沒有偏折"]])}
  <p class="fb" id="fb" role="status"></p>`,
  bind:()=>bindChoice("o1","toward","對！記住它的樣子。","再看一次：折射角比入射角大還是小？"),ok:()=>st.obs.o1==="toward"});

/* --- 第 3 組：反過來，水 → 空氣 --- */
add({k:"第 3 組・水→空氣",left:"sim",render:()=>`
  <h2>反過來：上方改 <span class="ui">水</span>、下方改 <span class="ui">空氣</span></h2>
  <p>現在光從水裡射向空氣，就像<b>杯底硬幣的光</b>要從水裡出來。</p>`,check:"換好了"});

/* ===== 量角度的步驟 ===== */
function angleStep(id,text,m1,m2,showI,fixI,target){
  const iv=fixI!=null?fixI:st.d[id+"_i"]??"";
  return `<h2>${text}</h2>
  <div class="fields">
    ${showI?`<label class="field"><span class="lab">入射角（${m1}中）</span><input id="ai" inputmode="decimal" value="${esc(iv)}"><span class="unit">度</span></label>`:""}
    <label class="field"><span class="lab">折射角（${m2}中）</span><input id="ar" inputmode="decimal" value="${esc(st.d[id+"_r"]??"")}"><span class="unit">度</span></label>
  </div>
  <p class="note">量角器：0° 對法線、90° 對水面。</p>
  <button type="button" class="btn primary" id="chk">檢查</button>
  <p class="fb" id="fb" role="status"></p>`;
}
function passed(id){return !!(st.d[id+"_ok"]||st.skip[id]);}
function bindAngles(id,m1,m2,showI,fixI,target){
  const show=(cls,msg)=>{const f=$("fb");f.className="fb "+cls;f.innerHTML=msg;};
  if(passed(id))show("good",st.skip[id]?"老師已確認，可以繼續。":"數據合理，可以按下一步。");
  ["ai","ar"].forEach(k=>$(k)&&$(k).addEventListener("input",()=>{st.d[id+"_ok"]=false;save();navState();$("fb").textContent="";$("fb").className="fb";}));
  $("chk").addEventListener("click",()=>{
    const i=showI?num($("ai").value):fixI, r=num($("ar").value);
    st.d[id+"_i"]=showI?$("ai").value:String(fixI); st.d[id+"_r"]=$("ar").value;
    if(i==null||r==null){show("bad","兩個角度都要填數字喔。");save();return;}
    if(target!=null&&Math.abs(i-target)>5){show("bad",`入射角要調到大約 ${r1(target)}°，再試一次。`);save();return;}
    const exp=snell(i,N[m1],N[m2]);
    if(exp!=null&&Math.abs(r-exp)<=TOL){st.d[id+"_ok"]=true;st.tries[id]=0;save();show("good","數據合理！可以按下一步。");navState();return;}
    st.tries[id]=(st.tries[id]||0)+1;save();
    let hint="跟模擬器的結果好像不一樣，再看一次量角器。";
    if(r>90||r<0)hint="角度要在 0°～90° 之間喔。";
    else if(exp!=null&&Math.abs(r-(90-exp))<=TOL)hint="你是不是從水面量的？量角器的 <b>0° 要對準法線</b>、90° 對齊水面。";
    else if(Math.abs(r-i)<=1&&i>3)hint="折射角跟入射角一樣嗎？再看一次光線有沒有偏折。";
    show("bad",hint+(st.tries[id]>=2?`<br><button type="button" class="tiny" id="tskip">老師確認過了，繼續</button>`:""));
    const sk=$("tskip");if(sk)sk.addEventListener("click",()=>{st.skip[id]=true;save();show("good","老師已確認，可以繼續。");navState();});
  });
}
function choice(key,opts){return `<div class="opts" data-key="${key}">${opts.map(([v,l])=>`<button type="button" class="opt" data-v="${v}" aria-pressed="${st.obs[key]===v}">${l}</button>`).join("")}</div>`;}
function bindChoice(key,right,good,bad){
  const g=document.querySelector(`.opts[data-key="${key}"]`),f=$("fb");
  const showFb=()=>{if(!st.obs[key])return;const ok=st.obs[key]===right;f.className="fb "+(ok?"good":"bad");f.textContent=ok?good:bad;};
  showFb();
  g.addEventListener("click",e=>{const b=e.target.closest(".opt");if(!b)return;st.obs[key]=b.dataset.v;save();
    g.querySelectorAll(".opt").forEach(x=>x.setAttribute("aria-pressed",String(x===b)));showFb();navState();});
}
const confTxt=v=>v==="guess"?"（猜的）":v==="sure"?"（有把握）":v==="unsure"?"（不確定）":"";
const confShort=v=>v==="guess"?"猜的":v==="sure"?"有把握":v==="unsure"?"不確定":"";
const firmer=()=>STMTS.map((_,ix)=>{const n=ix+1;return st.conf[n]==="guess"&&st.pconf[n]==="sure"?n:null;}).filter(Boolean);
const unsureL=()=>STMTS.map((_,ix)=>{const n=ix+1;return st.pconf[n]==="unsure"?n:null;}).filter(Boolean);
function growthLines(){const L=[],c=changed(),f=firmer(),u=unsureL();
  L.push(c.length?`改變判斷：第 ${c.join("、")} 題`:"判斷都沒有改變");
  if(f.length)L.push(`從「猜的」變「有把握」：第 ${f.join("、")} 題`);
  if(u.length)L.push(`還不確定：第 ${u.join("、")} 題`);
  return L;}
const changed=()=>STMTS.map((_,ix)=>{const n=ix+1;return st.pre[n]&&st.post[n]&&st.pre[n]!==st.post[n]?n:null;}).filter(Boolean);

/* ===== 我的數據（e度 對話時一直顯示在左邊） ===== */

${STMTS.map((t,ix)=>`${ix+1}.「${t}」我覺得：${mark(st.pre[ix+1])}${st.conf[ix+1]==="guess"?"（用猜的）":st.conf[ix+1]==="sure"?"（有把握）":""}`).join("\n")}

const ENDING=`最後一步（很重要）：全部討論完，先請我自己試著說出結論；再用下面的格式，給我一句完整、正確、國中生看得懂的結論（40 字以內），讓我清楚知道要記下哪一句：

const ORDER=`第1句：請我比較第1組和第2組，說明光從空氣進入水中，什麼情況下會偏折、什麼情況下不會。

(2) 組員最常見的 2 個錯誤說法，以及我可以怎麼提示（只提示「看第幾組數據」，不說答案）。

${ENDING}`;
  if(r==="lead")return `我是國中八年級學生，在組裡擔任「組長」，正在學「4-3 光的折射」。請你當我的學習夥伴，不要直接告訴我答案，用提問一步一步帶我用自己的數據檢查下面 4 句話。

${promptData()}

【請你這樣帶我】
1. 一次只問我一個問題，每次回答不超過 3 句，用國中生聽得懂的話。
2. 每一句都先問我要看「第幾組」數據，再讓我自己判斷對或錯；就算我原本判斷對了，也要我用數據說出為什麼。
${ORDER}
3. 如果我的數據看起來怪怪的，請我回模擬器再量一次。
4. 全部討論完，請我用一句話說明「為什麼加水後看得到杯底的硬幣」，並提醒我：等一下要帶組員每人說一句，給我一個可以問組員的問題。

${ENDING}`;
  return `我是國中八年級學生，正在學「4-3 光的折射」。自然科對我來說有點難，請你當我的學習夥伴，用很簡單的話，陪我一步一步想。

${promptData()}

【請你這樣帶我】
1. 每次回答最多 2 句話，用我平常說話的方式。用到「法線、入射角、折射角」這些詞時，先用一句簡單的話解釋。
2. 一次只問我 1 個問題，盡量給我 2～3 個選項讓我選。
3. 我答錯時，不要直接說答案，先給我一個提示（例如「看第幾組數據」），讓我再試一次；我答對了，請告訴我哪裡做得好。
4. 照這個順序，一句一句帶我判斷對或錯：
${ORDER}
5. 如果我的數據看起來怪怪的，請我回模擬器再量一次。

${ENDING.replace("40 字以內","30 字以內")}`;
}
function copyPrompt(){
  const txt=promptText(),f=$("fb");
  const fb=()=>{document.querySelector("details").open=true;const rg=document.createRange();rg.selectNodeContents($("prompt"));const sl=getSelection();sl.removeAllRanges();sl.addRange(rg);f.className="fb bad";f.textContent="已幫你選取文字，請長按後選「拷貝」。";};
  try{navigator.clipboard.writeText(txt).then(()=>{f.className="fb good";f.textContent="已複製！到 e度 對話框貼上就可以開始。";},fb);}catch(e){fb();}
}

/* ===== 一鍵把探究歷程卡存成圖片 ===== */
function wrap(g,text,maxW){const out=[];let line="";for(const ch of text){if(g.measureText(line+ch).width>maxW){out.push(line);line=ch;}else line+=ch;}if(line)out.push(line);return out;}
function cardCanvas(){
  const W=1080,F='"Noto Sans TC","PingFang TC",sans-serif',cv=document.createElement("canvas"),g=cv.getContext("2d");
  g.font=`30px ${F}`;
  const stLines=STMTS.map(t=>wrap(g,t,600));
  const whyLines=wrap(g,st.why,W-160);
  const conLines=wrap(g,st.concl||"",W-160);
  const gl=growthLines();
  const H=426+stLines.reduce((s,l)=>s+Math.max(2,l.length)*42+30,0)+60+gl.length*46+90+whyLines.length*44+90+(conLines.length?conLines.length*44+70:0);
  cv.width=W;cv.height=H;
  g.fillStyle="#EFF2F5";g.fillRect(0,0,W,H);
  g.fillStyle="#fff";g.strokeStyle="#2C5D8A";g.lineWidth=4;g.beginPath();g.roundRect(30,30,W-60,H-60,28);g.fill();g.stroke();
  g.fillStyle="#2C5D8A";g.font=`700 26px ${F}`;g.fillText("八年級自然・4-3 光的折射",80,100);
  g.fillStyle="#1B2430";g.font=`900 52px ${F}`;g.fillText("我的探究歷程卡",80,168);
  const who=`${roleNm()}　座號 ${st.seat}`;g.font=`700 34px ${F}`;g.fillText(who,W-80-g.measureText(who).width,168);
  g.fillStyle="#DCE7F2";g.beginPath();g.roundRect(80,200,W-160,166,16);g.fill();
  g.fillStyle="#1B2430";g.font=`28px ${F}`;
  g.fillText(`第 1 組 空氣→水（垂直）：入射 ${a(st.d.v_i)}°　折射 ${a(st.d.v_r)}°（不偏折）`,104,248);
  g.fillText(`第 2 組 空氣→水（斜射）：入射 ${a(st.d.w_i)}°　折射 ${a(st.d.w_r)}°（偏向法線）`,104,296);
  g.fillText(`第 3 組 水→空氣：入射 ${a(st.d.a_i)}°　折射 ${a(st.d.a_r)}°（偏離法線）`,104,344);
  let y=426;g.font=`700 24px ${F}`;g.fillStyle="#566273";g.fillText("敘述",80,y-12);g.fillText("直覺",W-300,y-12);g.fillText("最後",W-170,y-12);
  STMTS.forEach((t,ix)=>{const n=ix+1,ls=stLines[ix];g.strokeStyle="#CBD3DD";g.lineWidth=2;g.beginPath();g.moveTo(80,y);g.lineTo(W-80,y);g.stroke();
    g.font=`30px ${F}`;g.fillStyle="#1B2430";ls.forEach((l,k)=>g.fillText((k?"　 ":`${n}. `)+l,80,y+44+k*42));
    g.font=`700 40px ${F}`;g.fillText(mk(st.pre[n]),W-290,y+48);
    g.font=`22px ${F}`;g.fillStyle="#566273";g.fillText(confShort(st.conf[n]),W-300,y+82);
    const up=st.pre[n]!==st.post[n]||(st.conf[n]==="guess"&&st.pconf[n]==="sure");
    g.fillStyle=up?"#8A4B22":"#1B2430";g.font=`700 40px ${F}`;g.fillText(mk(st.post[n]),W-160,y+48);
    g.font=`${up?"700 ":""}22px ${F}`;g.fillText(confShort(st.pconf[n]),W-170,y+82);
    y+=Math.max(2,ls.length)*42+30;});
  g.fillStyle="#8A4B22";g.font=`700 30px ${F}`;gl.forEach((l,k)=>g.fillText(l,80,y+50+k*46));
  y+=60+gl.length*46+50;if(conLines.length){g.fillStyle="#1B2430";g.font=`700 30px ${F}`;g.fillText("📌 e度 結論：",80,y);g.font=`30px ${F}`;conLines.forEach((l,k)=>g.fillText(l,80,y+48+k*44));y+=conLines.length*44+70;}
  g.fillStyle="#1B2430";g.font=`700 30px ${F}`;g.fillText("我們組修好的一句話：",80,y);
  g.font=`30px ${F}`;whyLines.forEach((l,k)=>g.fillText(l,80,y+48+k*44));
  return cv;
}
function saveCard(){
  const f=$("fb"),cv=cardCanvas(),name=`4-3探究歷程卡_${st.seat||"座號"}.png`;
  cv.toBlob(async blob=>{
    const file=new File([blob],name,{type:"image/png"});
    try{if(navigator.canShare&&navigator.canShare({files:[file]})){await navigator.share({files:[file],title:"4-3 探究歷程卡"});f.className="fb good";f.textContent="完成！";return;}}catch(e){if(e&&e.name==="AbortError")return;}
    const url=URL.createObjectURL(blob),link=document.createElement("a");link.href=url;link.download=name;document.body.appendChild(link);link.click();link.remove();
    f.className="fb good";f.innerHTML=`已下載圖片。如果沒看到，<a href="${url}" target="_blank" rel="noopener">點這裡打開圖片</a>，再長按存到相簿。`;
  },"image/png");
}

/* ===== 左邊切換：影片／模擬器／我的數據 ===== */
let simLoaded=false;
function setLeft(mode){
  document.querySelector(".split").classList.toggle("noleft",mode==="none");
  ["Video","Sim","Data"].forEach(k=>$("pane"+k).classList.toggle("on",k.toLowerCase()===mode));
  if(mode!=="video"){try{$("vid").pause();}catch(e){}}
  if(mode==="none")return;
  if(mode==="sim"&&!simLoaded){setSim();simLoaded=true;}
  if(mode==="data")renderData();
  const u=st.sim==="backup"?SIM_BACKUP:SIM_MAIN;
  $("bar").innerHTML=mode==="sim"?`<span>因材網物理模擬「光的折射」（出自 PhET，CC-BY 4.0）</span><span class="row" style="gap:14px"><button type="button" id="swapSim">${st.sim==="backup"?"改回官網版":"模擬器載不出來？換備用版"}</button><a target="_blank" rel="noopener" href="${u}">在新分頁開啟</a></span>`
    :mode==="video"?`<span>生活情境：加水看見杯底的硬幣</span>`
    :`<span>e度 問你數據時，看這裡</span><button type="button" id="toSim">回模擬器再量一次</button>`;
  if($("swapSim"))$("swapSim").addEventListener("click",()=>{st.sim=st.sim==="backup"?"main":"backup";save();setSim();setLeft("sim");});
  if($("toSim"))$("toSim").addEventListener("click",()=>setLeft("sim"));
}
function setSim(){$("simFrame").src=st.sim==="backup"?SIM_BACKUP:SIM_MAIN;}
$("vid").addEventListener("ended",()=>{st.watched=true;save();if(STEPS[st.i].k==="看影片"){const f=$("fb");if(f){f.className="fb good";f.textContent="看完了！按下一步。";}navState();}});

/* ===== 步驟切換 ===== */
function go(delta){st.i=Math.max(0,Math.min(STEPS.length-1,st.i+delta));save();render();}
function navState(){
  const s=STEPS[st.i],nx=$("next");if(!nx)return;
  nx.disabled=!(s.check?!!st.obs["c"+st.i]:(s.ok?s.ok():true));
}
function render(){
  const s=STEPS[st.i];
  setLeft(s.left);
  let h=`<div class="step"><div class="kicker">${s.k}</div>${s.render()}`;
  if(s.check)h+=`<div><button type="button" class="opt" id="ck" aria-pressed="${!!st.obs["c"+st.i]}">✓ ${s.check}</button></div>`;
  h+=`<div class="nav"><button type="button" class="btn" id="prev"${st.i?"":" disabled"}>上一步</button>${s.last?"":`<button type="button" class="btn primary" id="next">下一步</button>`}</div></div>`;
  $("side").innerHTML=h;$("side").scrollTop=0;
  if(s.bind)s.bind();
  if(s.check)$("ck").addEventListener("click",e=>{st.obs["c"+st.i]=true;save();e.currentTarget.setAttribute("aria-pressed","true");navState();});
  $("prev").addEventListener("click",()=>go(-1));
  if($("next"))$("next").addEventListener("click",()=>go(1));
  navState();
  $("progTxt").textContent=`${st.i+1}／${STEPS.length}`;
  $("progBar").style.width=(100*(st.i+1)/STEPS.length)+"%";
}
if(st.i>=STEPS.length)st.i=0;
render();
</script>
